name: 支援請求
description: 回報使用問題或提出支援需求
title: "[支援] "
labels: [support]
body:
  - type: markdown
    attributes:
      value: |
        感謝你的回報。請勿附上姓名、聯絡資料、客戶資料、完整工作備註、驗證資訊或公司機密。
  - type: input
    id: version
    attributes:
      label: 服務版本
      description: 可在設定頁查看版本資訊。
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 請使用不含真實或機密資料的範例描述。
      placeholder: |
        1. 開啟某個頁面
        2. 點選某個功能
        3. 發生問題
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 實際結果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隱私確認
      options:
        - label: 我已確認內容與附件不含個人資料或機密資訊。
          required: true
